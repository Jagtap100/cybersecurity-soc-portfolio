<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Colour Me - SOC Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: white;
    }

    .header {
      background: #020617;
      padding: 25px;
      text-align: center;
      border-bottom: 1px solid #334155;
    }

    .header h1 {
      color: #38bdf8;
      margin-bottom: 10px;
    }

    .header p {
      color: #94a3b8;
    }

    .clock {
      color: #94a3b8;
      font-size: 14px;
      margin-top: 10px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #334155;
      text-align: center;
    }

    .card h3 {
      color: #94a3b8;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .number {
      font-size: 30px;
      font-weight: bold;
      color: #38bdf8;
    }

    .online {
      color: #22c55e;
    }

    .warning {
      color: #facc15;
    }

    .danger {
      color: #ef4444;
    }

    .panel {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      border: 1px solid #334155;
      margin-bottom: 25px;
    }

    .panel h2 {
      color: #38bdf8;
      margin-bottom: 20px;
    }

    .alert-box {
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 4px solid #ef4444;
    }

    .alert-box strong {
      display: block;
      margin-bottom: 6px;
    }

    .warning-box {
      border-left-color: #facc15;
    }

    .button {
      background: #ef4444;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
      font-size: 15px;
    }

    .button:hover {
      background: #dc2626;
    }

    #message {
      color: #22c55e;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .event {
      background: #0f172a;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
      border-left: 4px solid #38bdf8;
    }

    .event strong {
      color: #38bdf8;
    }

    .system {
      display: flex;
      justify-content: space-between;
      background: #0f172a;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .status {
      color: #22c55e;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #64748b;
    }

    @media (max-width: 700px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 450px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">

    <h1>🛡️ Colour Me SOC Dashboard</h1>

    <p>Security Operations Center Monitoring</p>

    <div class="clock" id="clock"></div>

  </div>


  <div class="container">

    <!-- Dashboard Cards -->

    <div class="cards">

      <div class="card">
        <h3>Security Alerts</h3>
        <div class="number danger" id="alertCount">3</div>
      </div>

      <div class="card">
        <h3>Systems Online</h3>
        <div class="number online">12</div>
      </div>

      <div class="card">
        <h3>Warnings</h3>
        <div class="number warning">2</div>
      </div>

      <div class="card">
        <h3>Monitoring</h3>
        <div class="number online">ACTIVE</div>
      </div>

    </div>


    <!-- Security Alerts -->

    <div class="panel">

      <h2>🚨 Security Alerts</h2>

      <button class="button" onclick="checkAlert()">
        🚨 Check Security Alert
      </button>

      <div id="message"></div>
